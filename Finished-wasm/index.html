  <body>

    <!-- On-screen Status Log Window -->
    <div id="status">Initializing boot sequence...</div>

    <canvas id="display"></canvas>
    <div id="terminal"></div>
    
    <script>
      function logStatus(message, isError = false) {
        const log = document.getElementById('status');
        const color = isError ? '#ff3333' : '#00ff00';
        const prefix = isError ? 'ERROR: ' : 'STATUS: ';
        log.innerHTML += `<span style="color: ${color}">\n${prefix}${message}</span>`;
        log.scrollTop = log.scrollHeight;
      }

      window.addEventListener('error', function(e) {
        logStatus(`${e.message} (File: ${e.filename.split('/').pop()}, Line: ${e.lineno})`, true);
      });
      window.addEventListener('unhandledrejection', function(e) {
        logStatus(`Promise Broken: ${e.reason}`, true);
      });

      window.Module = {};
    </script>

    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="./load.js"></script>

    <script type="module">
      (async () => {
        try {
          logStatus("Initializing terminal grid layout...");
          const xterm = new window.Terminal();
          xterm.open(document.getElementById("terminal"));

          logStatus("Loading local workspace scripts (module.js)...");
          await import('./module.js');

          logStatus("Compiling WebAssembly bundle infrastructure (out.js)...");
          // Dynamic import prevents module hoisting and allows logs to print first
          const outScript = await import('./out.js');
          const initEmscriptenModule = outScript.default;

          logStatus("Binding Canvas offscreen controller context...");
          const display = document.getElementById("display");
          Module.canvas = display.transferControlToOffscreen();
          
          Module.qemuWasmDisplay = {
            surface(width, height, format, stride, data) {
              display.width = width;
              display.height = height;
              display.dataset.format = format;
              display.dataset.stride = stride;
              display.dataset.data = data;
            },
            update(data, stride, x, y, width, height) {
              display.dataset.data = data;
              display.dataset.dirty = `${x},${y},${width},${height}`;
            },
          };

          logStatus("Opening virtual terminal streams (PTY)...");
          const { master, slave } = window.XtermPty.openpty();
          xterm.loadAddon(master);

          Module.pty = slave;
          Module['mainScriptUrlOrBlob'] = location.origin + "/out.js";
          
          logStatus("Allocating guest physical memory heap. Booting QEMU core...");
          const instance = await initEmscriptenModule(Module);
          logStatus("QEMU WebAssembly instance compiled perfectly!");
          
          var oldPoll = Module['TTY'].stream_ops.poll;
          var pty = Module['pty'];
          Module['TTY'].stream_ops.poll = function(stream, timeout){
              if (!pty.readable) {
                  return (pty.readable ? 1 : 0) | (pty.writable ? 4 : 4);
              }
              return oldPoll.call(stream, timeout);
          };
          
          logStatus("System configuration confirmed fine. All systems operational.");
        } catch (err) {
          logStatus(`Initialization Failure: ${err.message}`, true);
        }
      })();
    </script>
  </body>
