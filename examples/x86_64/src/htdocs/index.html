<html>
  <head>
    <title>QEMU on browser(x86_64)</title>
    <link rel="stylesheet" href="./vendor/xterm.css" />
  </head>
  <body>
    <canvas id="display"></canvas>
    <div id="terminal"></div>
    <script src="./load.js"></script>
    <script type="module">
      import 'https://unpkg.com/xterm@5.3.0/lib/xterm.js';
      import 'https://unpkg.com/xterm-pty/index.js';
      import './module.js'
      import initEmscriptenModule from './out.js';

      const xterm = new Terminal();
      xterm.open(document.getElementById("terminal"));

      const display = document.getElementById("display");
      Module.canvas = display.transferControlToOffscreen();
      Module.qemuWasmDisplay = {
        surface(width, height, format, stride, data) {
          display.width = width;
          display.height = height;
          display.dataset.format = format;
          display.dataset.stride = stride;
          display.dataset.data = data;
        },
        update(data, stride, x, y, width, height) {
          display.dataset.data = data;
          display.dataset.dirty = `${x},${y},${width},${height}`;
        },
      };

      const { master, slave } = openpty();

      xterm.loadAddon(master);

      Module.pty = slave;
      Module['mainScriptUrlOrBlob'] = location.origin + "/out.js";
      (async () => {
          const instance = await initEmscriptenModule(Module);
          
          var oldPoll = Module['TTY'].stream_ops.poll;
          var pty = Module['pty'];
          Module['TTY'].stream_ops.poll = function(stream, timeout){
              if (!pty.readable) {
                  return (pty.readable ? 1 : 0) | (pty.writable ? 4 : 0);
              }
              return oldPoll.call(stream, timeout);
          }
      })();
    </script>
  </body>
</html>
